<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Contact Tanuja through her accessible personal portfolio contact form."
    >

    <meta
        name="keywords"
        content="contact Tanuja, portfolio, web developer, contact form"
    >

    <meta
        name="author"
        content="Tanuja"
    >

    <title>Contact | Tanuja Portfolio</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Skip Navigation -->

    <a
        href="#main-content"
        class="skip-link"
    >
        Skip to main content
    </a>


    <!-- HEADER -->

    <header>

        <nav
            class="navbar"
            aria-label="Main navigation"
        >

            <h2 class="logo">
                Tanuja
            </h2>


            <ul class="nav-links">

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="about.html">
                        About
                    </a>
                </li>

                <li>
                    <a href="projects.html">
                        Projects
                    </a>
                </li>

                <li>
                    <a
                        href="contact.html"
                        aria-current="page"
                    >
                        Contact
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- MAIN -->

    <main id="main-content">

        <section
            class="page-section"
            aria-labelledby="contact-title"
        >

            <p class="eyebrow">
                Get In Touch
            </p>

            <h1 id="contact-title">
                Contact Me
            </h1>

            <p>
                Have a question or want to discuss a project?
                Send me a message using the form below.
            </p>

        </section>


        <!-- CONTACT FORM -->

        <section
            class="contact-section"
            aria-labelledby="form-title"
        >

            <h2 id="form-title">
                Send a Message
            </h2>

            <p id="form-help">
                Fields marked with
                <span aria-hidden="true">*</span>
                are required.
            </p>


            <form
                id="contactForm"
                novalidate
                aria-describedby="form-help"
            >


                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Name
                        <span aria-hidden="true">*</span>
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required
                        aria-required="true"
                        aria-describedby="name-error"
                    >

                    <p
                        id="name-error"
                        class="error-message"
                        aria-live="polite"
                    ></p>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                        <span aria-hidden="true">*</span>
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                        aria-required="true"
                        aria-describedby="email-error"
                    >

                    <p
                        id="email-error"
                        class="error-message"
                        aria-live="polite"
                    ></p>

                </div>


                <!-- MESSAGE -->

                <div class="form-group">

                    <label for="message">
                        Message
                        <span aria-hidden="true">*</span>
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required
                        aria-required="true"
                        aria-describedby="message-error"
                    ></textarea>

                    <p
                        id="message-error"
                        class="error-message"
                        aria-live="polite"
                    ></p>

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="submit-btn"
                    aria-label="Send contact form"
                >
                    Send Message
                </button>


                <p
                    id="form-status"
                    role="status"
                    aria-live="polite"
                ></p>

            </form>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        <p>
            &copy; 2026 Tanuja. All rights reserved.
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
